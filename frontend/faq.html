        <!-- Global Settings API Integration -->
        <script>
            // Fetch and update global settings
            async function fetchGlobalSettings() {
                try {
                    const response = await fetch('https://ef-cms-production.up.railway.app/api/global-settings');
                    const settings = await response.json();
                    
                    // Store settings globally for access by other functions
                    window.globalSettings = settings;
                    
                // Update header location
                const headerLocation = document.querySelector('.site-header .bi-geo-alt').parentElement;
                if (headerLocation) {
                    if (settings.location && settings.location.trim() !== '') {
                        headerLocation.innerHTML = `<i class="bi-geo-alt me-2"></i>${settings.location}`;
                        headerLocation.style.display = 'flex';
                    } else {
                        headerLocation.style.display = 'none';
                    }
                }
                
                // Update header email
                const headerEmail = document.querySelector('.site-header .bi-envelope').parentElement;
                if (headerEmail) {
                    if (settings.mail && settings.mail.trim() !== '') {
                        headerEmail.innerHTML = `<i class="bi-envelope me-2"></i><a href="mailto:${settings.mail}">${settings.mail}</a>`;
                        headerEmail.style.display = 'flex';
                    } else {
                        headerEmail.style.display = 'none';
                    }
                }
                
                // Update header social links
                const headerFacebook = document.querySelector('.site-header .bi-facebook');
                if (headerFacebook) {
                    if (settings.facebookUrl && settings.facebookUrl.trim() !== '') {
                        headerFacebook.href = settings.facebookUrl;
                        headerFacebook.style.display = 'block';
                    } else {
                        headerFacebook.style.display = 'none';
                    }
                }
                
                const headerInstagram = document.querySelector('.site-header .bi-instagram');
                if (headerInstagram) {
                    if (settings.instagramUrl && settings.instagramUrl.trim() !== '') {
                        headerInstagram.href = settings.instagramUrl;
                        headerInstagram.style.display = 'block';
                    } else {
                        headerInstagram.style.display = 'none';
                    }
                }
                
                const headerWhatsapp = document.querySelector('.site-header .bi-whatsapp');
                if (headerWhatsapp) {
                    if (settings.whatsappNumber && settings.whatsappNumber.trim() !== '') {
                        headerWhatsapp.href = `https://wa.me/${settings.whatsappNumber.replace(/[^0-9]/g, '')}`;
                        headerWhatsapp.style.display = 'block';
                    } else {
                        headerWhatsapp.style.display = 'none';
                    }
                }
                    
                    // Update navigation bar logo
                    const navLogo = document.querySelector('.navbar-brand img');
                    if (navLogo) {
                        navLogo.src = settings.mainLogo;
                    }
                    
                    // Update footer logo
                    const footerLogo = document.querySelector('.site-footer .logo');
                    if (footerLogo) {
                        footerLogo.src = settings.mainLogo;
                    }
                    
                    // Update favicon
                    const favicon = document.querySelector('link[rel="icon"]');
                    if (favicon) {
                        favicon.href = settings.mainLogo;
                    }
                    
                // Update footer phone
                const footerPhone = document.querySelector('.site-footer .bi-telephone').parentElement;
                if (footerPhone) {
                    if (settings.whatsappNumber && settings.whatsappNumber.trim() !== '') {
                        footerPhone.innerHTML = `<i class="bi-telephone me-2"></i><a href="tel:${settings.whatsappNumber}" class="site-footer-link">${settings.whatsappNumber}</a>`;
                        footerPhone.style.display = 'flex';
                    } else {
                        footerPhone.style.display = 'none';
                    }
                }
                
                // Update footer email
                const footerEmail = document.querySelector('.site-footer .bi-envelope').parentElement;
                if (footerEmail) {
                    if (settings.mail && settings.mail.trim() !== '') {
                        footerEmail.innerHTML = `<i class="bi-envelope me-2"></i><a href="mailto:${settings.mail}" class="site-footer-link">${settings.mail}</a>`;
                        footerEmail.style.display = 'flex';
                    } else {
                        footerEmail.style.display = 'none';
                    }
                }
                
                // Update footer location
                const footerLocation = document.querySelector('.site-footer .bi-geo-alt').parentElement;
                if (footerLocation) {
                    if (settings.location && settings.location.trim() !== '') {
                        footerLocation.innerHTML = `<i class="bi-geo-alt me-2"></i>${settings.location}`;
                        footerLocation.style.display = 'flex';
                    } else {
                        footerLocation.style.display = 'none';
                    }
                }
                
                // Update footer social links
                const footerFacebook = document.querySelector('.site-footer .bi-facebook');
                if (footerFacebook) {
                    if (settings.facebookUrl && settings.facebookUrl.trim() !== '') {
                        footerFacebook.href = settings.facebookUrl;
                        footerFacebook.style.display = 'block';
                    } else {
                        footerFacebook.style.display = 'none';
                    }
                }
                
                const footerInstagram = document.querySelector('.site-footer .bi-instagram');
                if (footerInstagram) {
                    if (settings.instagramUrl && settings.instagramUrl.trim() !== '') {
                        footerInstagram.href = settings.instagramUrl;
                        footerInstagram.style.display = 'block';
                    } else {
                        footerInstagram.style.display = 'none';
                    }
                }
                
                const footerWhatsapp = document.querySelector('.site-footer .bi-whatsapp');
                if (footerWhatsapp) {
                    if (settings.whatsappNumber && settings.whatsappNumber.trim() !== '') {
                        footerWhatsapp.href = `https://wa.me/${settings.whatsappNumber.replace(/[^0-9]/g, '')}`;
                        footerWhatsapp.style.display = 'block';
                    } else {
                        footerWhatsapp.style.display = 'none';
                    }
                }
                    
                    console.log('Global settings updated successfully');
                } catch (error) {
                    console.error('Error fetching global settings:', error);
                }
            }
            
            // Fetch and populate FAQ content
            async function fetchFAQContent() {
                try {
                    const response = await fetch('https://ef-cms-production.up.railway.app/api/faq?page=1&limit=10&search=question');
                    const faqData = await response.json();
                    
                    // Store FAQ data globally for access by other functions
                    window.faqData = faqData;
                    
                    // Clear existing FAQ content
                    const faqContainer = document.querySelector('.container-faq');
                    if (faqContainer) {
                        // Keep the heading, remove all question divs
                        const heading = faqContainer.querySelector('.heading');
                        const existingQuestions = faqContainer.querySelectorAll('.question');
                        existingQuestions.forEach(question => question.remove());
                        
                        // Add FAQ items dynamically
                        faqData.forEach((item, index) => {
                            const questionDiv = document.createElement('div');
                            questionDiv.className = 'question';
                            questionDiv.innerHTML = `
                                <button>
                                    <span id="faq-q${index + 1}">${item.question_es}</span>
                                    <i class="fas fa-chevron-down d-arrow"></i>
                                </button>
                                <p id="faq-a${index + 1}">${item.answer_es}</p>
                            `;
                            faqContainer.appendChild(questionDiv);
                        });
                        
                        // Reinitialize FAQ functionality with a small delay
                        setTimeout(() => {
                            initFAQAccordion();
                        }, 100);
                    }
                    
                    console.log('FAQ content updated successfully');
                } catch (error) {
                    console.error('Error fetching FAQ content:', error);
                }
            }
            
            // Initialize FAQ accordion functionality
            function initFAQAccordion() {
                const faqButtons = document.querySelectorAll('.question button');
                
                faqButtons.forEach(button => {
                    // Remove existing event listeners to prevent duplicates
                    button.removeEventListener('click', handleFAQClick);
                    // Add new event listener
                    button.addEventListener('click', handleFAQClick);
                });
                
                console.log('FAQ accordion initialized with', faqButtons.length, 'buttons');
            }
            
            // FAQ accordion click handler
            function handleFAQClick(e) {
                e.preventDefault();
                e.stopPropagation();
                
                console.log('FAQ button clicked');
                
                const question = this.closest('.question');
                const answer = question.querySelector('p');
                const icon = this.querySelector('.d-arrow');
                
                const isActive = answer.classList.contains('show');
                console.log('Question is active:', isActive);
                
                // Close all questions first
                const allFaqButtons = document.querySelectorAll('.question button');
                allFaqButtons.forEach(otherButton => {
                    const otherQuestion = otherButton.closest('.question');
                    const otherAnswer = otherQuestion.querySelector('p');
                    const otherIcon = otherButton.querySelector('.d-arrow');
                    otherAnswer.classList.remove('show');
                    otherIcon.classList.remove('rotate');
                });
                
                // If the clicked question wasn't active, make it active
                if (!isActive) {
                    answer.classList.add('show');
                    icon.classList.add('rotate');
                    console.log('Question opened');
                } else {
                    console.log('Question closed');
                }
            }
            
            // Call the functions when the page loads
            document.addEventListener('DOMContentLoaded', function() {
                fetchGlobalSettings();
                fetchFAQContent();
            });
        </script>

                    enlaces: "Links",
                    nuestraHistoriaLink: "Our Story",
                    mirarDocumental: "Watch Documentary",
                    realizarDonacion: "Make a Donation",
                    asociarseConNosotros: "Partner with Us",
                    contactanos: "Contact Us",
                    obtenerDireccion: "Get Directions"
                }
            };

            // FAQ Language Switcher Functionality
            class FAQLanguageSwitcher {
                constructor() {
                    // Get language from localStorage or default to Spanish
                    this.currentLanguage = localStorage.getItem('userLanguagePreference') || 'es';
                    this.translations = faqTranslations;
                }
                
                init() {
                    this.setupLanguageSwitcher();
                    this.updateLanguageDisplay();
                    this.translateContent();
                }
                
                setupLanguageSwitcher() {
                    const languageOptions = document.querySelectorAll('.language-option');
                    
                    languageOptions.forEach(option => {
                        option.addEventListener('click', (e) => {
                            e.preventDefault();
                            
                            const selectedLang = option.getAttribute('data-lang');
                            console.log('🌍 FAQ Language option clicked:', selectedLang);
                            
                            this.switchLanguage(selectedLang);
                        });
                    });
                }
                
                switchLanguage(newLang) {
                    console.log('🌍 FAQ Switching language to:', newLang);
                    
                    if (this.currentLanguage === newLang) {
                        console.log('🌍 Language already selected:', newLang);
                        return;
                    }
                    
                    this.currentLanguage = newLang;
                    
                    // Store language preference in localStorage for persistence
                    localStorage.setItem('userLanguagePreference', newLang);
                    console.log('💾 Language preference saved to localStorage:', newLang);
                    
                    // Update display
                    this.updateLanguageDisplay();
                    
                    // Translate content
                    this.translateContent();
                    
                    console.log('✅ FAQ Language switched to:', newLang);
                }
                
                updateLanguageDisplay() {
                    const currentLanguageSpan = document.getElementById('current-language');
                    if (currentLanguageSpan) {
                        currentLanguageSpan.textContent = this.currentLanguage.toUpperCase();
                    }
                    
                    // Update active state in dropdown
                    const languageOptions = document.querySelectorAll('.language-option');
                    languageOptions.forEach(option => {
                        const lang = option.getAttribute('data-lang');
                        if (lang === this.currentLanguage) {
                            option.classList.add('active');
                        } else {
                            option.classList.remove('active');
                        }
                    });
                }
                
                translateContent() {
                    console.log('🔄 Translating FAQ content to:', this.currentLanguage);
                    
                    const t = this.translations[this.currentLanguage];
                    if (!t) {
                        console.error('❌ No translations found for language:', this.currentLanguage);
                        return;
                    }
                    
                    // Helper function to safely update text content
                    const updateText = (selector, key) => {
                        try {
                            const element = document.querySelector(selector);
                            if (element && t[key]) {
                                console.log('✅ Updating', selector, 'to:', t[key]);
                                element.textContent = t[key];
                            } else {
                                console.log('⚠️ Element not found or no translation:', selector, 'key:', key);
                            }
                        } catch (error) {
                            console.error('❌ Error updating', selector, ':', error);
                        }
                    };
                    
                    const updateHTML = (selector, key) => {
                        try {
                            const element = document.querySelector(selector);
                            if (element && t[key]) {
                                console.log('✅ Updating HTML', selector, 'to:', t[key]);
                                element.innerHTML = t[key];
                            }
                        } catch (error) {
                            console.error('❌ Error updating HTML', selector, ':', error);
                        }
                    };
                    
                    // Navigation
                    updateText('a[href="index.html#section_1"]', 'inicio');
                    updateText('a[href="index.html#section_2"]', 'acercaDe');
                    updateText('a[href="historia.html"]', 'voluntario');
                    updateText('#navbarLightDropdownMenuLink', 'mas');
                    updateText('a[href="noticias.html"]', 'noticias');
                    updateText('a[href="eventos.html"]', 'eventos');
                    updateText('a[href="index.html#section_6"]', 'contacto');
                    updateText('a[href="faq.html"]', 'faq');
                    updateText('a[href="donate.html"].custom-btn', 'dona');
                    
                    // FAQ Content - Update dynamic content from API
                    updateText('#faq-title', 'faqTitle');
                    
                    // Update dynamic FAQ content from API data
                    if (window.faqData && window.faqData.length > 0) {
                        window.faqData.forEach((item, index) => {
                            const questionElement = document.getElementById(`faq-q${index + 1}`);
                            const answerElement = document.getElementById(`faq-a${index + 1}`);
                            
                            if (questionElement) {
                                const questionText = this.currentLanguage === 'en' ? item.question_en : item.question_es;
                                questionElement.textContent = questionText;
                            }
                            
                            if (answerElement) {
                                const answerText = this.currentLanguage === 'en' ? item.answer_en : item.answer_es;
                                answerElement.textContent = answerText;
                            }
                        });
                    }
                    
                    // Footer
                    const footerTitles = document.querySelectorAll('.site-footer-title');
                    footerTitles.forEach((title, index) => {
                        const text = title.textContent.trim();
                        if (text.includes('Enlaces') && t.enlaces) {
                            title.textContent = t.enlaces;
                        } else if (text.includes('Contáctanos') && t.contactanos) {
                            title.textContent = t.contactanos;
                        }
                    });
                    
                    
                    // Footer links
                    const footerLinks = document.querySelectorAll('.footer-menu-link');
                    footerLinks.forEach((link, index) => {
                        const href = link.getAttribute('href');
                        const text = link.textContent.trim();
                        
                        if (href === 'index.html#section_2' && t.nuestraHistoriaLink) {
                            link.textContent = t.nuestraHistoriaLink;
                        } else if (href === 'index.html#documentary' && t.mirarDocumental) {
                            link.textContent = t.mirarDocumental;
                        } else if (href === 'donate.html' && t.realizarDonacion) {
                            link.textContent = t.realizarDonacion;
                        } else if (href === 'index.html#section_6' && t.asociarseConNosotros) {
                            link.textContent = t.asociarseConNosotros;
                        }
                    });
                    
                    console.log('✅ FAQ content translated to:', this.currentLanguage);
                }
            }
            
            // Initialize FAQ language switcher when DOM is ready
            document.addEventListener('DOMContentLoaded', function() {
                window.faqLanguageSwitcher = new FAQLanguageSwitcher();
                window.faqLanguageSwitcher.init();
            });
        </script>

                paypalBtn.addEventListener('change', function () {
                  if (paypalBtn.checked) {
                    stripeBtn.style.display = 'none'; // Hide Stripe button
                    // Display PayPal specific elements here
                  } else {
                    stripeBtn.style.display = 'block'; // Show Stripe button
                    // Hide PayPal specific elements here
                  }
                });
              }
            });
        </script>
        
        <!-- Handle cross-page navigation with proper scroll offset -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                document.querySelectorAll('a[href^="index.html#"]').forEach(link => {
                    link.addEventListener('click', function(e) {
                        const href = this.getAttribute('href');
                        
                        // Skip if not a valid section link
                        if (!href || href === 'index.html#' || this.classList.contains('language-option')) {
                            return;
                        }
                        
                        // Extract the section ID from the href
                        const sectionId = href.split('#')[1];
                        if (!sectionId) return;
                        
                        // Store the section ID to scroll to after page load
                        sessionStorage.setItem('scrollToSection', sectionId);
                    });
                });
                
                // Check if we need to scroll to a section after page load
                const scrollToSection = sessionStorage.getItem('scrollToSection');
                if (scrollToSection) {
                    // Clear the stored section
                    sessionStorage.removeItem('scrollToSection');
                    
                    // Wait a bit for the page to fully load, then scroll
                    setTimeout(() => {
                        const target = document.getElementById(scrollToSection);
                        if (target) {
                            const navbar = document.querySelector('.navbar');
                            const navbarHeight = navbar ? navbar.offsetHeight : 0;
                            
                            window.scrollTo({
                                top: target.offsetTop - navbarHeight - 20,
                                behavior: 'smooth'
                            });
                        }
                    }, 500);
                }
            });
        </script>
    </body>
</html>
